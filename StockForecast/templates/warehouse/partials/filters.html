<form class="filter-strip" method="get"><select name="warehouse"><option value="">All sales locations</option>{% for item in filters.warehouses %}<option value="{{ item.warehouse_id }}" {% if active.warehouse == item.warehouse_id %}selected{% endif %}>{{ item.warehouse_name }}</option>{% endfor %}</select><select name="category"><option value="">All categories</option>{% for x in filters.categories %}<option {% if active.category == x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select><select name="season"><option value="">All seasons</option>{% for x in filters.seasons %}<option {% if active.season == x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select><select name="month"><option value="">Any month</option>{% for value, name in filters.months %}<option value="{{ value }}" {% if active.month == value|stringformat:'s' %}selected{% endif %}>{{ name }}</option>{% endfor %}</select><select name="year"><option value="">Any year</option>{% for x in filters.years %}<option {% if active.year == x|stringformat:'s' %}selected{% endif %}>{{ x }}</option>{% endfor %}</select><button class="btn btn-dark">Apply view</button><a href="{{ request.path }}">Clear</a></form>
